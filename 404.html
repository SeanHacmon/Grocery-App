<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Grocery App - Redirecting...</title>
    <script type="text/javascript">
        // Redirect script for GitHub Pages SPA
        var l = window.location;
        var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
                      '/Grocery-App/' + l.pathname.substr(1).split('/').slice(1).join('/') + 
                      (l.search ? l.search : '') + l.hash;
        
        console.log('Redirecting from:', l.href);
        console.log('Redirecting to:', redirect);
        
        window.location.replace(redirect);
    </script>
</head>
<body>
    <p>Redirecting to Grocery App...</p>
</body>
</html>
