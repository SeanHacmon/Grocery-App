<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Grocery App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"/>
    <link rel="stylesheet" href="./client/assets/home-BdNU43T4.css"/>
    <style>
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background-image: url('./images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        window.__reactRouterContext = {
            "basename": "/Grocery-App",
            "future": {
                "unstable_middleware": false,
                "unstable_optimizeDeps": false,
                "unstable_splitRouteModules": false,
                "unstable_subResourceIntegrity": false,
                "unstable_viteEnvironmentApi": false
            },
            "routeDiscovery": {"mode": "initial"},
            "ssr": false,
            "isSpaMode": true
        };
        
        window.__reactRouterRouteModules = {};
    </script>
    
    <!-- Load the main entry file -->
    <script type="module" src="./client/assets/entry.client-DZAi_oRo.js"></script>
    
    <!-- Also load other modules that might be needed -->
    <script type="module" src="./client/assets/root-Dy02bG3G.js"></script>
    <script type="module" src="./client/assets/home-DrQQwkAl.js"></script>
    <script type="module" src="./client/assets/chunk-NL6KNZEE-CfxFt-pq.js"></script>
    
    <script>
        // Debug logging
        console.log('Index.html loaded');
        console.log('React Router Context:', window.__reactRouterContext);
        
        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Script error:', e.error);
        });
        
        // Check if React loaded after a delay
        setTimeout(() => {
            const root = document.getElementById('root');
            if (!root.innerHTML || root.innerHTML.trim() === '') {
                console.error('React app failed to mount');
                root.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: rgba(255,255,255,0.9); margin: 20px; border-radius: 10px;">
                        <div style="text-align: center;">
                            <h2>Grocery App</h2>
                            <p>Loading failed. Please check the browser console for errors.</p>
                            <button onclick="location.reload()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Reload Page</button>
                        </div>
                    </div>
                `;
            }
        }, 3000);
    </script>
</body>
</html>
