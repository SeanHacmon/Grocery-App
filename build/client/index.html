<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Grocery App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"/>
    <style>
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background-image: url('./images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 24px;
            color: #333;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">Loading Grocery App...</div>
    </div>
    
    <script>
        window.__reactRouterContext = {
            "basename": "/Grocery-App",
            "future": {
                "unstable_middleware": false,
                "unstable_optimizeDeps": false,
                "unstable_splitRouteModules": false,
                "unstable_subResourceIntegrity": false,
                "unstable_viteEnvironmentApi": false
            },
            "routeDiscovery": {"mode": "initial"},
            "ssr": false,
            "isSpaMode": true
        };
    </script>
    
    <!-- Note the ./client/assets/ path instead of ./assets/ -->
    <script type="module" src="./client/assets/entry.client-DZAi_oRo.js"></script>
    
    <script>
        // Fallback error handling
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root.innerHTML.includes('Loading Grocery App...')) {
                console.log('App failed to load, trying alternative paths...');
                // Try different possible paths
                const script = document.createElement('script');
                script.type = 'module';
                script.src = './client/assets/index.js';
                document.head.appendChild(script);
            }
        }, 5000);
    </script>
</body>
</html>
